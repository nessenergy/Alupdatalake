name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        type: choice
        options:
          - dev
          - hml
          - prod
      module:
        description: 'Módulo a deployar'
        required: true
        type: choice
        options:
          - all
          - infra
          - connectors
      image_sha:
        description: 'SHA completo da imagem já publicada; obrigatório para infra'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  imagem:
    name: "Imagem da CLI (${{ inputs.environment }})"
    if: inputs.module == 'all' || inputs.module == 'connectors'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: |
          BASE="${{ vars.IMAGEM_INGESTAO }}"
          docker build -t "$BASE:${GITHUB_SHA}" -t "$BASE:latest" .
          docker push "$BASE:${GITHUB_SHA}"
          docker push "$BASE:latest"
          echo "publicada: $BASE:${GITHUB_SHA}"

  terraform:
    name: "Terraform (${{ inputs.environment }})"
    needs: imagem
    if: >-
      always() &&
      (inputs.module == 'all' || inputs.module == 'infra') &&
      (inputs.module == 'infra' || needs.imagem.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validar referência da imagem
        id: image
        env:
          DEPLOY_MODULE: ${{ inputs.module }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          IMAGE_BASE: ${{ vars.IMAGEM_INGESTAO }}
        run: |
          if [ "$DEPLOY_MODULE" = "all" ]; then
            TAG="${GITHUB_SHA}"
          else
            TAG="$IMAGE_SHA"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Informe o SHA completo de uma imagem já publicada."
            exit 1
          fi
          echo "reference=$IMAGE_BASE:$TAG" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          # Workload Identity Federation: nenhuma chave JSON de service account
          # no repositório ou nos secrets do GitHub.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Conferir imagem e aplicar infraestrutura
        env:
          INGESTION_IMAGE: ${{ steps.image.outputs.reference }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SA }}
          DATAFORM_GIT_TOKEN_VERSION: ${{ vars.DATAFORM_GIT_TOKEN_VERSAO }}
        run: |
          # Falha antes do init/plan se a imagem não existe no ambiente escolhido.
          # `images describe` traz o resumo de vulnerabilidades e exige
          # containeranalysis.occurrences.list, que a SA de deploy não tem — e
          # não deve ter, porque o bootstrap dá a ela só escrita no repositório
          # de imagens. `images list` responde a mesma pergunta com o que ela já
          # pode ler.
          encontrada="$(gcloud artifacts docker images list "${INGESTION_IMAGE%:*}" \
            --include-tags --filter="tags:${INGESTION_IMAGE##*:}" --format='value(version)')"
          if [ -z "$encontrada" ]; then
            echo "::error::Imagem $INGESTION_IMAGE não existe em $DEPLOY_ENVIRONMENT."
            exit 1
          fi
          cd infra
          # State no bucket do próprio projeto, criado pelo bootstrap.
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars" \
            -var="imagem_ingestao=$INGESTION_IMAGE" \
            -var="deploy_service_account=$DEPLOY_SERVICE_ACCOUNT" \
            -var="dataform_git_token_versao=$DATAFORM_GIT_TOKEN_VERSION" \
            -out=tfplan
          terraform apply tfplan
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --no-dev
      # Bronze, Silver e Gold vêm do Dataform (ADR 012). Roda logo após o apply:
      # a carga nunca cria tabela Bronze. Projeto e região saem do state, e não
      # do padrão da configuração, para que um deploy de prod não caia em dev.
      - run: |
          cd infra
          export GCP_PROJECT_ID="$(terraform output -raw project_id)"
          export GCP_REGION="$(terraform output -raw region)"
          SA="$(terraform output -raw service_account_dataform)"
          REPO="$(terraform output -raw repositorio_dataform)"
          cd ..
          if [ -z "$REPO" ]; then
            echo "::error::Repositorio Dataform ainda nao existe: grave o token do GitHub no secret alupdata-dataform-git-token e defina DATAFORM_GIT_TOKEN_VERSAO no ambiente do GitHub (docs/runbook/primeiro-deploy.md), depois reexecute o deploy."
            exit 1
          fi
          uv run python -m scripts.executar_dataform --service-account "$SA" --repositorio "$REPO"
