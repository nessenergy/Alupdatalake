name: CI — Lint, Testes & Segurança

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: "Lint & Formatação"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/

  tests:
    name: "Testes pytest"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  atribuicao:
    name: "Commits sem atribuição a IA"
    runs-on: ubuntu-latest
    # Só em PR: na push para main os commits já passaram por aqui, e o
    # histórico anterior à regra não deve reprovar builds novos.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Regra 6 (AGENTS.md). Repete o hook commit-msg local, que só roda para
      # quem instalou `pre-commit install --hook-type commit-msg`.
      - run: python scripts/verifica_atribuicao.py --demo
      - run: |
          python scripts/verifica_atribuicao.py --intervalo \
            "origin/${{ github.base_ref }}..HEAD"

  sast:
    name: "SAST (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run bandit -r src/ scripts/ -ll -f json -o bandit-report.json || true
      - run: uv run bandit -r src/ scripts/ -ll
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  secrets-scan:
    name: "Detecção de Secrets"
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSAO: "8.28.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: segredo vazado e removido depois continua no
          # histórico, e é exatamente esse o caso que precisa ser pego.
          fetch-depth: 0
      # O binário, não a action: `gitleaks-action@v2` exige licença paga para
      # organizações e falha antes de varrer qualquer coisa. O gitleaks em si
      # é open source, e é ele que a cláusula 8ª pede.
      - run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  terraform-lint:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: |
          cd infra
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
      # Raiz separada, aplicada pela ness. uma vez por projeto (ADR 015).
      - run: |
          cd infra/bootstrap
          terraform init -backend=false
          terraform validate

  dataform-compile:
    name: "Dataform Compile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --extra dev
      # Compila sem credencial: pega ref quebrado, dependência circular e config
      # inválida antes do merge. Versão igual à de workflow_settings.yaml.
      - run: npx --yes @dataform/cli@3.0.69 compile --json > "$RUNNER_TEMP/dataform-graph.json"
      - name: Verifica dependências de qualidade da Gold
        env:
          DATAFORM_GRAPH: ${{ runner.temp }}/dataform-graph.json
        run: uv run pytest tests/unit/test_sql.py -q -k compiled_gold
