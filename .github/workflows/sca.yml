name: SCA — Scan de Dependências

on:
 pull_request:
 branches: [main]
 schedule:
 - cron: '0 11 * * 1'

permissions:
 contents: read

jobs:
 audit:
 name: "Auditoria de Dependências"
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: astral-sh/setup-uv@v4
 with:
 version: "latest"
 - run: uv sync --frozen
 - run: uv run pip-audit --strict --desc
