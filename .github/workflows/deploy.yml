name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        type: choice
        options:
          - dev
          - prod
      module:
        description: 'Módulo a deployar'
        required: true
        type: choice
        options:
          - all
          - infra
          - connectors
          - dags

permissions:
  contents: read
  id-token: write

jobs:
  imagem:
    name: "Imagem da CLI (${{ inputs.environment }})"
    if: inputs.module == 'all' || inputs.module == 'connectors'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: |
          BASE="${{ vars.IMAGEM_INGESTAO }}"
          docker build -t "$BASE:${GITHUB_SHA}" -t "$BASE:latest" .
          docker push "$BASE:${GITHUB_SHA}"
          docker push "$BASE:latest"
          echo "publicada: $BASE:${GITHUB_SHA}"

  terraform:
    name: "Terraform (${{ inputs.environment }})"
    needs: imagem
    if: >-
      always() &&
      (inputs.module == 'all' || inputs.module == 'infra') &&
      (inputs.module == 'infra' || needs.imagem.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation: nenhuma chave JSON de service account
          # no repositório ou nos secrets do GitHub.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: |
          TAG="latest"
          if [ "${{ inputs.module }}" = "all" ]; then TAG="${GITHUB_SHA}"; fi
          cd infra
          terraform init
          terraform plan -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="imagem_ingestao=${{ vars.IMAGEM_INGESTAO }}:${TAG}" -out=tfplan
          terraform apply tfplan
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --no-dev
      - run: uv run python -m scripts.deploy_views

  sync-dags:
    name: "Sync DAGs (${{ inputs.environment }})"
    if: inputs.module == 'all' || inputs.module == 'dags'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation: nenhuma chave JSON de service account
          # no repositório ou nos secrets do GitHub.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gsutil -m rsync -r -d dags/ gs://${{ vars.COMPOSER_BUCKET }}/dags/
