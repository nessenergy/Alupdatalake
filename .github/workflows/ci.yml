name: CI — Lint, Testes & Segurança

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: "Lint & Formatação"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/

  tests:
    name: "Testes pytest"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  sast:
    name: "SAST (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      - run: uv run bandit -r src/ scripts/ -ll -f json -o bandit-report.json || true
      - run: uv run bandit -r src/ scripts/ -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  secrets-scan:
    name: "Detecção de Secrets"
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSAO: "8.28.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: segredo vazado e removido depois continua no
          # histórico, e é exatamente esse o caso que precisa ser pego.
          fetch-depth: 0
      # O binário, não a action: `gitleaks-action@v2` exige licença paga para
      # organizações e falha antes de varrer qualquer coisa. O gitleaks em si
      # é open source, e é ele que a cláusula 8ª pede.
      - run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  terraform-lint:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: |
          cd infra
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
