name: Atribuição — varredura do GitHub

# Comentário de issue não passa por hook nem por CI de pull request: quando é
# publicado, já está visível para a contratante. Não há como bloquear antes.
# O que dá para fazer é detectar cedo, todo dia, e falhar alto — para que a
# correção seja pontual em vez de arqueologia. Regra 6 do AGENTS.md.

on:
  schedule:
    - cron: "0 11 * * *" # 08h em São Paulo
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  varredura:
    name: "Issues, PRs e comentários sem menção a ferramenta"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --extra dev
      # A autoverificação roda antes de usar o script: se o próprio detector
      # estiver quebrado, é melhor falhar aqui do que reportar "limpo".
      - run: uv run pytest tests/unit/test_verifica_atribuicao.py -q
      - run: uv run python scripts/verifica_atribuicao.py --github "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
