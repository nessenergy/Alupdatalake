# Painel vivo: a página e o dados.json vêm do bucket montado em
# /usr/share/nginx/html e mudam de hora em hora. Sem cabeçalho, o navegador
# guarda a página por heurística e mostra a versão antiga depois de um deploy.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
