# CI no Cloud Build (ADR 030, fase 1). O arquivo só chama o script; a lógica está no Makefile
# (`make ci`), para o Actions e o Cloud Build rodarem exatamente os mesmos comandos.
#
# `_ALVOS` é o que o `make` executa. Os dois gatilhos rodam as etapas que não dependem do intervalo do PR: a checagem
# de atribuição (`ci-atribuicao`) fica de fora porque compara com a main, e o build do Cloud Build não tem credencial para
# buscá-la no repositório privado (o fetch pede usuário, mesmo na imagem `git` do Cloud Build). Essa checagem segue no
# job "Commits sem atribuição" do GitHub Actions; trazê-la para cá exige guardar um token no Secret Manager, decisão aberta.
steps:
  - id: ci
    name: node:22-bookworm
    entrypoint: bash
    args: ["cloudbuild/ci.sh", "${_ALVOS}"]

substitutions:
  _ALVOS: "ci-lint ci-testes ci-sast ci-segredos ci-terraform ci-dataform ci-sca"

options:
  # Conta de serviço própria exige log no Cloud Logging (ou num bucket); sem isso o build é recusado.
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
