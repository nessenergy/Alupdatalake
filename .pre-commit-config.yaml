repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.3"
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Regra 6 (AGENTS.md): o histórico é artefato contratual — sem atribuição a IA.
  # Exige `pre-commit install --hook-type commit-msg`; o CI repete a checagem
  # para quem não instalou os hooks.
  - repo: local
    hooks:
      - id: sem-atribuicao-ia
        name: "Commit sem atribuição a ferramenta de IA"
        entry: python scripts/verifica_atribuicao.py
        language: system
        stages: [commit-msg]
