name: Conferir cargas

# Conferência das cargas no BigQuery sem login pessoal: roda o conjunto FIXO de
# consultas de scripts/conferir_cargas.py com a SA de deploy (ADR 015) e
# publica as contagens no resumo da execução. SOMENTE LEITURA: só SELECT/WITH,
# sem escrita, sem carga, sem criar tabela. A única entrada é o ambiente, que
# o `environment:` já valida; nada vindo do usuário entra no script por `${{ }}`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente'
        required: true
        type: choice
        options:
          - dev
          - hml
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: conferir-cargas-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  conferir:
    name: "Conferir cargas (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --no-dev
      - name: Conferir
        env:
          GCP_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: uv run python -m scripts.conferir_cargas
