name: SCA — Scan de Dependências

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: "Auditoria de Dependências"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.11"
      # `--extra dev` é obrigatório: ruff, pytest, bandit e pip-audit vivem
      # em [project.optional-dependencies].dev, que o sync padrão não instala.
      - run: uv sync --frozen --extra dev
      # audita as dependências resolvidas; o próprio pacote (editable) não está no PyPI
      - run: uv export --no-emit-project --no-hashes --extra dev -o .requirements.txt -q
      - run: uv run pip-audit --strict --desc -r .requirements.txt
