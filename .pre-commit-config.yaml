repos:
  # A rev acompanha o ruff das dev-dependencies. Divergir das duas versões faz
  # o hook e o CI formatarem diferente, e todo commit vira churn de formatação.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.3"
    hooks:
      - id: bandit
        # `pass_filenames: false` é obrigatório junto de `-r src/`: sem isso o
        # pre-commit anexa os arquivos do commit aos argumentos e o bandit
        # aborta com "unrecognized arguments". O alvo é o pacote inteiro, e é
        # o mesmo que o CI varre.
        args: ["-r", "src/", "scripts/", "-ll"]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Regra 6 (AGENTS.md): o histórico é artefato contratual — sem atribuição a IA.
  # Exige `pre-commit install --hook-type commit-msg`; o CI repete a checagem
  # para quem não instalou os hooks.
  - repo: local
    hooks:
      - id: sem-atribuicao-ia
        name: "Commit sem atribuição a ferramenta de IA"
        entry: python scripts/verifica_atribuicao.py
        language: system
        stages: [commit-msg]
