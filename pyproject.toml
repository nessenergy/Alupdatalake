[project]
name = "alupdata"
version = "0.1.0"
description = "AlupData DataLake — Fase 1: conectores e pipelines de dados para o Grupo Alupar"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1.5",
    "flask>=3.1.3",
    # O Portal roda no Cloud Run sob gunicorn (infra/modules/portal). Sem ele
    # na imagem, o contêiner não sobe e a sonda de inicialização reprova —
    # foi o que derrubou o primeiro apply de dev em 23/09. O servidor de
    # desenvolvimento do Flask não serve produção.
    "gunicorn>=23.0",
]

[project.optional-dependencies]
# Drivers puro-Python das fontes internas da Onda 3. Fora das dependências
# base: conector de API pública não precisa deles, e a imagem fica menor.
bancos = [
    "oracledb>=2.5",
    "pymysql>=1.1",
    "python-tds>=1.15",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolve as anotações em runtime: os imports dos tipos usados nos
# modelos precisam continuar fora do bloco TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
targets = ["src"]
severity = ["high", "medium"]

[project.scripts]
alupdata = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "sqlglot>=30.17.0",
]
