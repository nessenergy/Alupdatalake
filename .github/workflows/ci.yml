name: CI — Lint, Testes & Segurança

on:
 pull_request:
 branches: [main]
 push:
 branches: [main]

permissions:
 contents: read

jobs:
 lint:
 name: "Lint & Formatação"
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: astral-sh/setup-uv@v4
 with:
 version: "latest"
 - run: uv sync --frozen
 - run: uv run ruff check src/ tests/
 - run: uv run ruff format --check src/ tests/

 tests:
 name: "Testes pytest"
 runs-on: ubuntu-latest
 needs: lint
 steps:
 - uses: actions/checkout@v4
 - uses: astral-sh/setup-uv@v4
 with:
 version: "latest"
 - run: uv sync --frozen
 - run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml
 - uses: actions/upload-artifact@v4
 if: always()
 with:
 name: coverage-report
 path: coverage.xml

 sast:
 name: "SAST (Bandit)"
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: astral-sh/setup-uv@v4
 with:
 version: "latest"
 - run: uv sync --frozen
 - run: uv run bandit -r src/ -ll -f json -o bandit-report.json || true
 - run: uv run bandit -r src/ -ll
 - uses: actions/upload-artifact@v4
 if: always()
 with:
 name: bandit-report
 path: bandit-report.json

 secrets-scan:
 name: "Detecção de Secrets"
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 with:
 fetch-depth: 0
 - uses: gitleaks/gitleaks-action@v2
 env:
 GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

 terraform-lint:
 name: "️ Terraform Validate"
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: hashicorp/setup-terraform@v3
 - run: |
 cd infra
 terraform init -backend=false
 terraform fmt -check -recursive
 terraform validate
