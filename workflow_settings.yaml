# Projeto Dataform (ADR 012). Fica na raiz porque o Dataform lê o projeto só a
# partir da raiz do repositório Git. Projeto e região valem para a compilação
# local; no GCP, a release configuration do Terraform sobrescreve os dois.
dataformCoreVersion: 3.0.69
defaultProject: alupar-dev-alupdata
defaultLocation: us-east1
defaultDataset: silver
defaultAssertionDataset: qualidade
vars:
  regiao: us-east1
