name: Painel

# Atualiza o painel vivo do projeto (docs/planos/2026-09-25-painel-vivo.md).
# Lê as execuções de dev e hml, as issues `tipo/dependencia` e o teste de
# conexão, gera o dados.json e o publica no bucket do painel, no projeto da
# ness. Só sai metadado de execução, nunca linha de dado.
#
# A tela do Aditivo 01 (painel/aditivo.html) vem junto: dados-aditivo.json sai
# só de painel/aditivo.toml, hand-editado — sem consulta a BigQuery ou GitHub.
#
# O hml só autentica em job do ambiente `hml`; `deployment: false` usa o
# ambiente sem registrar um deployment a cada hora.

on:
  schedule:
    - cron: "7 */3 * * *" # de 3 em 3 horas (era de hora em hora; ADR 030). Depois de deploy e ingestão manual roda sozinho
  workflow_run:
    workflows: ["Deploy GCP", "Executar ingestão", "Testar conexão"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: read

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  hml:
    name: "Execuções de hml"
    runs-on: ubuntu-latest
    environment:
      name: hml
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --no-dev
      - name: Exportar execuções
        run: uv run python -m scripts.painel --so-execucoes --ambiente "hml=alupar-hm-alupdata" --saida execucoes-hml.json
      # Artefato, não saída de job nem variável de ambiente: o histórico passa de
      # 128 KB e estoura o limite do Linux ("Argument list too long"), o que
      # derrubou o painel de 21 a 24/11.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execucoes-hml
          path: execucoes-hml.json

  publicar:
    name: "Gerar e publicar"
    needs: hml
    # Sem hml, o painel sai só com dev, em vez de não sair.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.5.11"
      - run: uv sync --frozen --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: execucoes-hml
      - name: Gerar dados.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          [ -f execucoes-hml.json ] || : > execucoes-hml.json
          uv run python -m scripts.painel --ambiente "dev=alupar-dev-alupdata" \
            --execucoes-de execucoes-hml.json --repositorio "$REPOSITORIO" --saida dados.json
      - name: Gerar dados-aditivo.json
        # Sem BigQuery nem GitHub: painel/aditivo.toml já traz o estado de cada
        # item, editado à mão junto com docs/contrato/aditivo-01-conjuntos-publicos.md.
        run: uv run python -m scripts.painel_aditivo --saida dados-aditivo.json
      # Troca de identidade: daqui em diante, a do painel no projeto da ness.,
      # que só grava no bucket do painel.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PAINEL_WIF_PROVIDER }}
          service_account: ${{ vars.PAINEL_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Publicar
        env:
          BUCKET: ${{ vars.PAINEL_BUCKET }}
        run: |
          gcloud storage cp dados.json dados-aditivo.json painel/index.html painel/aditivo.html "gs://$BUCKET/" --cache-control="no-store"
          echo "Painel publicado: $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
